# Nginx — Jesus is the Way Jebathottam (Next.js on :3000)
# Install: /etc/nginx/sites-available/ministry

upstream ministry_node {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name jesusisthewayjebathottam.com www.jesusisthewayjebathottam.com;
    return 301 https://jesusisthewayjebathottam.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.jesusisthewayjebathottam.com;
    # ssl_certificate /etc/letsencrypt/live/jesusisthewayjebathottam.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/jesusisthewayjebathottam.com/privkey.pem;
    return 301 https://jesusisthewayjebathottam.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name jesusisthewayjebathottam.com;

    # ssl_certificate /etc/letsencrypt/live/jesusisthewayjebathottam.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/jesusisthewayjebathottam.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location /_next/static/ {
        proxy_pass http://ministry_node;
        proxy_http_version 1.1;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://ministry_node;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
