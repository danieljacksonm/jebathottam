; Sample Asterisk extensions.conf for SIP bridge (Twilio -> Asterisk -> Jigasi -> Jitsi).
; Place in /etc/asterisk/extensions.conf (backup original first).
;
; Prerequisites:
; - Twilio Elastic SIP Trunk sends inbound calls to this Asterisk (Termination URI = sip:VPS_IP:5060).
; - Jigasi is installed and registers as a SIP user (e.g. jigasi) on this Asterisk or on the same Jitsi server.
; - Get room name and PIN from the app: curl https://YOUR_SITE/api/sip/dial-in-info
;
; Inbound from Twilio: answer -> optional PIN prompt -> dial Jigasi with Jitsi room name.

[general]
static=yes
writeprotect=no

; Context for calls coming from Twilio (set in sip.conf for the Twilio trunk)
[from-twilio]
; Optional: play prompt and read PIN, then set JITSI_ROOM based on PIN.
; For a single fixed room, just dial Jigasi with the room name.
;
; Single room (no PIN): replace MinistryLine with your jitsi_room_name from /api/sip/dial-in-info
exten => _X.,1,Verbose(1,Inbound call from Twilio)
 same => n,Answer()
 same => n,Wait(1)
 ; Dial Jigasi: it will join the Jitsi room and bridge the caller.
 ; SIP/user is the Jigasi SIP account registered to Asterisk.
 ; Replace MinistryLine with the value from your app (jitsi_room_name).
 same => n,Dial(SIP/jigasi@jitsi,60,M(setJitsiRoom^MinistryLine^1))
 same => n,Hangup()

; Macro to pass room name to Jigasi (Jigasi may use channel variable or custom header)
[setJitsiRoom]
exten => s,1,Set(JITSI_ROOM=${ARG1})
 same => n,Return()

; Fallback
[default]
exten => _X.,1,Hangup()
