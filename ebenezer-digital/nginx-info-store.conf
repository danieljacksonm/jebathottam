# BEFORE SSL: HTTP-only blocks so `nginx -t` works and Certbot can issue certs.
# Do NOT paste listen 443 / ssl_certificate lines until the PEM files exist.
#
# Drop on VPS (example):
#   sudo cp nginx-info-store.conf /etc/nginx/sites-available/ebenezer-info-store
#   sudo ln -sf /etc/nginx/sites-available/ebenezer-info-store /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then for each host:
#   sudo certbot --nginx -d example.com -d www.example.com
# Certbot will add HTTPS itself.

# ---- shared proxy snippet idea: all → Next.js :3000 ----

server {
    listen 80;
    listen [::]:80;
    server_name ebenezerdigital.info www.ebenezerdigital.info;
    client_max_body_size 20M;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
}

