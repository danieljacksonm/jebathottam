# Drop on VPS as /etc/nginx/sites-available/ebenezer-info-store
# sudo ln -sf /etc/nginx/sites-available/ebenezer-info-store /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx

# HTTP → HTTPS  (.info)
server {
    listen 80;
    listen [::]:80;
    server_name ebenezerdigital.info www.ebenezerdigital.info;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS  (.info)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ebenezerdigital.info www.ebenezerdigital.info;
    client_max_body_size 20M;

    ssl_certificate /etc/letsencrypt/live/ebenezerdigital.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ebenezerdigital.info/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
}

# HTTP  (.store) — get cert later with: sudo certbot --nginx -d ebenezerdigital.store -d www.ebenezerdigital.store
server {
    listen 80;
    listen [::]:80;
    server_name ebenezerdigital.store www.ebenezerdigital.store;
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
}
