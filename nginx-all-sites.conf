# Copy to VPS: sudo cp nginx-all-sites.conf /etc/nginx/sites-available/all-sites
# Enable:      sudo ln -sf /etc/nginx/sites-available/all-sites /etc/nginx/sites-enabled/
# Test/reload: sudo nginx -t && sudo systemctl reload nginx
# HTTPS:       sudo certbot --nginx -d ebenezerdigital.com -d www.ebenezerdigital.com -d ebenezar.yegova.store -d demo.jesusisthewayjebathottam.com -d krishna.yegova.store -d canaan.yegova.store

# ==================== EBENEZER DIGITAL (main domain + old subdomain) ====================
# After DNS + SSL work, you can redirect ebenezar.yegova.store → ebenezerdigital.com
server {
    listen 80;
    server_name ebenezerdigital.com www.ebenezerdigital.com ebenezar.yegova.store;
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
}

