# Deploy all three sites to VPS when you push to main (like Vercel auto-deploy).
# Requires GitHub repo secrets: VPS_HOST, VPS_USER, SSH_PRIVATE_KEY.

name: Deploy All Sites to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual run from Actions tab

jobs:
  deploy-ebenezer:
    name: Deploy Ebenezer Digital
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$GITHUB_WORKSPACE/.deploy_key"
          chmod 600 "$GITHUB_WORKSPACE/.deploy_key"
      - name: Deploy Ebenezer Digital to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key_path: ${{ github.workspace }}/.deploy_key
          command_timeout: 20m
          script: |
            cd /home/dani/ebenezer-digital || { echo "ERROR: Directory not found"; exit 1; }
            echo "=== Deploying Ebenezer Digital ==="
            git fetch origin main
            git reset --hard origin/main
            rm -rf .next
            npm ci
            export NEXT_PUBLIC_BUILD_TIME=$(date -Iseconds)
            npm run build
            pm2 restart ebenezer-digital || pm2 start ecosystem.config.js --only ebenezer-digital
            pm2 save
            echo "✅ Ebenezer Digital deployed at: $(date)" > .deploy-timestamp
            echo "=== Ebenezer Digital deployed ==="

