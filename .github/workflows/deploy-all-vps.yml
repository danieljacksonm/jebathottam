# Deploy all three sites to VPS when you push to main (like Vercel auto-deploy).
# Requires GitHub repo secrets: VPS_HOST, VPS_USER, SSH_PRIVATE_KEY.

name: Deploy All Sites to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual run from Actions tab

jobs:
  deploy-all:
    name: Deploy All Sites to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy All Sites to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            echo "🚀 Starting deployment of all sites..."
            set -euo pipefail
            
            # Deploy Ebenezer Digital
            echo "=== Deploying Ebenezer Digital ==="
            # Prefer monorepo if present (VPS often keeps full jebathottam/test checkout)
            if [ -d /home/dani/test/ebenezer-digital ] && [ -d /home/dani/test/.git ]; then
              cd /home/dani/test
              if [ -f ebenezer-digital/data/store.json ]; then
                cp ebenezer-digital/data/store.json /tmp/eben-store-deploy.bak
              fi
              git fetch origin main
              git reset --hard origin/main
              if [ -f /tmp/eben-store-deploy.bak ]; then
                cp /tmp/eben-store-deploy.bak ebenezer-digital/data/store.json
              fi
              cd /home/dani/test/ebenezer-digital
            else
              cd /home/dani/ebenezer-digital || { echo "ERROR: ebenezer-digital directory not found"; exit 1; }
              if [ -f data/store.json ]; then
                cp data/store.json /tmp/eben-store-deploy.bak
              fi
              git fetch origin main
              git reset --hard origin/main
              if [ -f /tmp/eben-store-deploy.bak ]; then
                cp /tmp/eben-store-deploy.bak data/store.json
              fi
            fi
            test -f package.json || { echo "ERROR: package.json missing — wrong directory"; pwd; exit 1; }
            rm -rf .next
            npm install --legacy-peer-deps
            export NEXT_PUBLIC_BUILD_TIME=$(date -Iseconds)
            npm run build
            pm2 restart ebenezer-digital --update-env || pm2 start /home/dani/ecosystem.config.js --only ebenezer-digital
            echo "✅ Ebenezer Digital deployed at: $(date)" > .deploy-timestamp
            
            # Deploy Ministry Platform
            echo "=== Deploying Ministry Platform ==="
            cd /home/dani/ministry-platform || { echo "ERROR: ministry-platform directory not found"; exit 1; }
            git fetch origin main
            git reset --hard origin/main
            rm -rf .next node_modules package-lock.json
            npm install --legacy-peer-deps
            export NEXT_PUBLIC_BUILD_TIME=$(date -Iseconds)
            npm run build
            pm2 restart ministry-platform || pm2 start /home/dani/ecosystem.config.js --only ministry-platform
            echo "✅ Ministry Platform deployed at: $(date)" > .deploy-timestamp
            
            # Deploy Sri Krishna Mobiles
            echo "=== Deploying Sri Krishna Mobiles ==="
            cd /home/dani/sri-krishna-mobiles || { echo "ERROR: sri-krishna-mobiles directory not found"; exit 1; }
            git fetch origin main
            git reset --hard origin/main
            rm -rf .next node_modules package-lock.json
            npm install --legacy-peer-deps
            export NEXT_PUBLIC_BUILD_TIME=$(date -Iseconds)
            npm run build
            pm2 restart sri-krishna-mobiles || pm2 start /home/dani/ecosystem.config.js --only sri-krishna-mobiles
            echo "✅ Sri Krishna Mobiles deployed at: $(date)" > .deploy-timestamp

            # Deploy Canaan Travel Hub (lives as agntix-template inside the jebathottam repo)
            echo "=== Deploying Canaan Travel Hub ==="
            MONOREPO=""
            if [ -d /home/dani/test/.git ]; then MONOREPO=/home/dani/test
            elif [ -d /home/dani/newjebathottam/.git ]; then MONOREPO=/home/dani/newjebathottam
            elif [ -d /home/dani/jebathottam/.git ]; then MONOREPO=/home/dani/jebathottam
            fi

            if [ -n "$MONOREPO" ]; then
              cd "$MONOREPO"
              git fetch origin main
              git reset --hard origin/main
              mkdir -p /home/dani/agntix-template
              rsync -a --delete \
                --exclude node_modules --exclude .next --exclude data/enquiries.jsonl \
                "$MONOREPO/agntix-template/" /home/dani/agntix-template/
              cp "$MONOREPO/ecosystem.config.js" /home/dani/ecosystem.config.js
            elif [ -d /home/dani/agntix-template/.git ]; then
              cd /home/dani/agntix-template
              git fetch origin main
              git reset --hard origin/main
            else
              echo "ERROR: Canaan source not found (no monorepo and no /home/dani/agntix-template/.git)"
              exit 1
            fi

            cd /home/dani/agntix-template || { echo "ERROR: agntix-template directory not found"; exit 1; }
            npm install --legacy-peer-deps
            export NEXT_PUBLIC_SITE_URL=https://canaantravelhub.com
            export NEXT_PUBLIC_BUILD_TIME=$(date -Iseconds)
            npm run build
            pm2 restart canaan-travel || pm2 start /home/dani/ecosystem.config.js --only canaan-travel
            echo "✅ Canaan Travel Hub deployed at: $(date)" > .deploy-timestamp
            
            # Save PM2 configuration
            cd /home/dani
            pm2 save
            
            echo "🎉 All sites deployed successfully!"
            echo "📊 Deployment Summary:"
            echo "  - Ebenezer Digital: http://localhost:3000"
            echo "  - Ministry Platform: http://localhost:3001"
            echo "  - Sri Krishna Mobiles: http://localhost:3002"
            echo "  - Canaan Travel Hub: http://localhost:3003"
