# Deploy to VPS when you push to main (like Vercel auto-deploy).
# Requires GitHub repo secrets: VPS_HOST, VPS_USER, SSH_PRIVATE_KEY, VPS_DEPLOY_PATH.

name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual run from Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Write key to file so newlines are preserved (avoids "no key found")
      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$GITHUB_WORKSPACE/.deploy_key"
          chmod 644 "$GITHUB_WORKSPACE/.deploy_key"
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key_path: ${{ github.workspace }}/.deploy_key
          command_timeout: 20m
          script: |
            cd ${{ secrets.VPS_DEPLOY_PATH }} || { echo "ERROR: VPS_DEPLOY_PATH not found"; exit 1; }
            echo "=== Deploy path: $(pwd) ==="
            git fetch origin main
            git reset --hard origin/main
            echo "=== Commit now on server: $(git rev-parse --short HEAD) ==="
            rm -rf .next
            npm ci
            export NEXT_PUBLIC_BUILD_TIME=$(date -Iseconds)
            npm run build
            pm2 restart ministry-platform || pm2 start npm --name "ministry-platform" -- start
            pm2 save
            echo "=== Deploy done. Running: $(git rev-parse --short HEAD) ==="
